name: build

# Every push to main and every pull request, a button in the Actions tab, and version tags
# (v1.2.3), which also publish a GitHub Release with the installers and disk images.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, test and validate; no installer or release yet. docs/windows.md has the plan this job
  # is the first steps of.
  windows:
    name: Windows (Release)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Puts MSVC on the PATH, so Ninja can be used the same way as on macOS rather than the
      # multi-config Visual Studio generator.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # AMPSIM_COPY_PLUGIN off: JUCE's default VST3 destination is under Program Files, and a
      # failed copy would end the build before it says anything about the code. AMPSIM_BUILD_TOOLS
      # for the benchmark below.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAMPSIM_COPY_PLUGIN=OFF -DAMPSIM_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The same validator and strictness as the macOS job: threading and state bugs a DAW hides.
      - name: Install pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      # bash, not PowerShell: pluginval.exe is a GUI-subsystem program, and PowerShell does not
      # wait for those. The first run returned after five seconds, mid-way through the editor
      # tests, with a green tick that meant nothing. bash waits, and takes its exit code.
      - name: Validate the VST3
        shell: bash
        run: |
          ./pluginval/pluginval.exe --strictness-level 10 \
            --validate build/AmpSim_artefacts/Release/VST3/AmpSim.vst3

      # Each page of the panel as Windows renders it, for looking at: nothing here can judge a
      # caption that has moved or a font that has fallen back, but a person can, from the artefact.
      - name: Render the panel
        run: ./build/ampsim_snapshot.exe panel 1.5

      - uses: actions/upload-artifact@v4
        with:
          name: AmpSim-Windows-panel
          path: panel/*.png
          if-no-files-found: error

      # Also proves the build is AVX2 and has ASIO: a build that lost either would still pass every
      # test, and only cost more or offer the standalone no low-latency driver. Then the benchmark, which asserts nothing; a shared runner changes
      # hardware between runs, so compare figures only within one job. 48 kHz is the model's own
      # rate; 44.1 kHz puts the resampler in the chain.
      - name: Benchmark
        run: |
          foreach ($flag in '/arch:AVX2', 'JUCE_ASIO=1') {
            if (-not (Select-String -Path build/build.ninja -Pattern $flag -SimpleMatch -Quiet)) {
              throw "$flag did not reach the compile lines"
            }
          }
          (Get-CimInstance Win32_Processor).Name
          ./build/ampsim_bench.exe 48000
          ./build/ampsim_bench.exe 44100

      # The raw build as well as the installer, for trying by hand without installing anything.
      - uses: actions/upload-artifact@v4
        with:
          name: AmpSim-Windows
          path: |
            build/AmpSim_artefacts/Release/Standalone/AmpSim.exe
            build/AmpSim_artefacts/Release/VST3/AmpSim.vst3
          if-no-files-found: error

      # Reuses the build above, as the macOS job does; it also refuses a binary that imports the
      # DLL C++ runtime, which nothing else here would notice.
      - name: Package
        run: ./packaging/package-windows.ps1 -BuildDir build

      # Both ways the installer can be run, each installed twice so the second is an upgrade over
      # the first, then uninstalled. Start-Process -Wait because the installer is a GUI program,
      # which PowerShell otherwise does not wait for. The AVX2 refusal cannot be tested here: the
      # runner has AVX2.
      - name: Install, upgrade and uninstall
        run: |
          $setup = (Get-ChildItem build/artefacts/*-setup.exe).FullName
          function Run($file, $arguments) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$file $arguments exited with $($p.ExitCode)" }
          }
          $cases = @(
            @{ Mode = '/ALLUSERS';    Vst3 = "$env:CommonProgramFiles\VST3\AmpSim.vst3";              App = "$env:ProgramFiles\AmpSim" },
            @{ Mode = '/CURRENTUSER'; Vst3 = "$env:LOCALAPPDATA\Programs\Common\VST3\AmpSim.vst3"; App = "$env:LOCALAPPDATA\Programs\AmpSim" }
          )
          foreach ($c in $cases) {
            "=== $($c.Mode)"
            foreach ($pass in 'install', 'upgrade') {
              Run $setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART $($c.Mode) /LOG=`"$PWD\$pass.log`""
              foreach ($path in "$($c.Vst3)\Contents\x86_64-win\AmpSim.vst3", "$($c.App)\AmpSim.exe",
                                "$($c.App)\licenses\LICENSE-AmpSim.txt", "$($c.App)\licenses\OFL-Jost.txt",
                                "$($c.App)\licenses\LICENSE-ASIO-SDK.txt") {
                if (-not (Test-Path $path)) { Get-Content "$pass.log" -Tail 40; throw "$pass did not install $path" }
              }
              "$pass ok"
            }
            Run "$($c.App)\unins000.exe" "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
            # The uninstaller hands over to a copy of itself and exits, so wait on the files.
            $deadline = (Get-Date).AddSeconds(60)
            while ((Test-Path $c.Vst3) -or (Test-Path "$($c.App)\AmpSim.exe")) {
              if ((Get-Date) -gt $deadline) { throw "$($c.Mode): still installed 60 s after uninstalling" }
              Start-Sleep -Seconds 1
            }
            "uninstall ok"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: AmpSim-Windows-installer
          path: build/artefacts/*-setup.exe
          if-no-files-found: error

  # One leg per kind of Mac, each built, tested and validated natively on that kind of Mac rather
  # than cross-built: auval and pluginval load the plugin, which an Intel binary cannot do on Apple
  # silicon without Rosetta, and the AVX2 Intel build is only proven by running it on Intel.
  macos:
    name: macOS ${{ matrix.name }} (Release)
    strategy:
      # Let both finish, so one failing does not hide what the other would have said. A tag still
      # publishes nothing unless both pass: the release job needs the whole matrix.
      fail-fast: false
      matrix:
        include:
          # macos-latest rather than a pinned version: GitHub retires old runner images, and a
          # pinned label that has been retired fails before it builds anything.
          - name: Apple silicon
            runner: macos-latest
            arch: arm64
            artifact: AmpSim-macOS-AppleSilicon
          # Pinned, because there is no "latest" Intel label: macos-15-intel is the last Intel
          # image GitHub provides, and it is retired in autumn 2027. After that this leg has
          # nowhere to run, and the Intel build will have to be cross-built on Apple silicon and
          # tested under Rosetta, or dropped.
          - name: Intel
            runner: macos-15-intel
            arch: x86_64
            artifact: AmpSim-macOS-Intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          # JUCE, NAM Core, Eigen, nlohmann/json and Catch2 are all submodules, and NAM Core has
          # submodules of its own. Shallow, because no history is needed to build a pinned tag.
          submodules: recursive
          fetch-depth: 1

      - name: Install Ninja
        run: brew install ninja

      # The architecture named rather than left to the runner, so a runner that turned out to be
      # the other kind of Mac fails the build instead of quietly producing the wrong one; the
      # package step checks every binary against it. AMPSIM_BUILD_TOOLS for the benchmark below.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DAMPSIM_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build

      # The offline suite: DSP behaviour, state round-trips, MIDI mapping, presets. This is the
      # layer the plugin validators never look at.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # And the validators: threading and state bugs that a DAW hides. This is a Release build, so
      # AMPSIM_COPY_PLUGIN is on by default and COPY_PLUGIN_AFTER_BUILD has
      # already put the AU where auval will find it.
      - name: Validate the Audio Unit
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Amp1 Ctcd

      - name: Install pluginval
        run: |
          curl -fsSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip

      - name: Validate the VST3
        # Drop --strictness-level if the runner ever proves flaky about opening editors; the GUI
        # tests are the part that depends on a window server.
        run: |
          ./pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 10 \
            --validate build/AmpSim_artefacts/Release/VST3/AmpSim.vst3

      # Asserts nothing, as on Windows: compare figures only within one job. On the Intel leg it
      # also proves the AVX2 build is what was made, since a build without it passes every test
      # and only costs more. 48 kHz is the model's own rate; 44.1 kHz puts the resampler in.
      - name: Benchmark
        run: |
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            for flag in -mavx2 -mfma; do
              grep -q -- "$flag" build/build.ninja || { echo "$flag did not reach the compile lines" >&2; exit 1; }
            done
          fi
          sysctl -n machdep.cpu.brand_string
          ./build/ampsim_bench 48000
          ./build/ampsim_bench 44100

      # Proves the installer still builds and signs on every run, and is what a tagged run
      # publishes.
      - name: Package
        # Reuses the build above rather than making a second one; the script only has to
        # reconfigure to drop the tests.
        run: AMPSIM_BUILD_DIR=build AMPSIM_ARCH=${{ matrix.arch }} ./packaging/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/artefacts/*
          if-no-files-found: error

  # Tags only, and only once both platforms have built, tested and packaged: a tag cannot publish
  # one platform while the other failed. The tag has to match the version in CMakeLists.txt,
  # which is also where package.sh and package-windows.ps1 read it from and so where the files take
  # their names; the same pattern, deliberately, so they cannot disagree about what is released.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Only CMakeLists.txt is needed, for the version; not the submodules.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Both Macs' packages, into the one directory: their names already say which is which.
      - uses: actions/download-artifact@v4
        with:
          pattern: AmpSim-macOS-*
          merge-multiple: true
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: AmpSim-Windows-installer
          path: release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^project(AmpSim VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version $version in CMakeLists.txt" >&2
            exit 1
          fi
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "AmpSim $version" \
            --notes-file - \
            --verify-tag <<EOF
          AmpSim $version.

          **macOS:** macOS 11 or later, in two builds. Files ending \`macos-apple-silicon\` are for M-series Macs; files ending \`macos-intel\` are for Intel Macs, which need a processor with AVX2 (every Intel Mac that runs macOS 11 except the 2013 Mac Pro). The installer refuses the wrong one. \`.pkg\` installs the Audio Unit, the VST3 and the standalone; \`.dmg\` holds the standalone alone. Ad-hoc signed: the first use needs System Settings > Privacy & Security > Open Anyway.

          **Windows:** Windows 10 version 2004 or later, or Windows 11, on x64 with an AVX2 processor (Intel Core from 2013, any AMD Ryzen). \`setup.exe\` installs the VST3 and the standalone, for you or for everyone. Unsigned: SmartScreen needs More info > Run anyway. In the standalone, choose your interface's ASIO driver in Options for low latency.

          Installing, and what to do the first time: https://github.com/CatastrophicCoder/ampsim/blob/v$version/packaging/README.md
          User guide: https://catastrophiccoder.github.io/ampsim/
          EOF
