name: build

# Every push to main and every pull request, a button in the Actions tab, and version tags
# (v1.2.3), which also publish a GitHub Release with the installer and disk image.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, test and validate; no installer or release yet. docs/windows.md has the plan this job
  # is the first steps of.
  windows:
    name: Windows (Release)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Puts MSVC on the PATH, so Ninja can be used the same way as on macOS rather than the
      # multi-config Visual Studio generator.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # AMPSIM_COPY_PLUGIN off: JUCE's default VST3 destination is under Program Files, and a
      # failed copy would end the build before it says anything about the code. AMPSIM_BUILD_TOOLS
      # for the benchmark below.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAMPSIM_COPY_PLUGIN=OFF -DAMPSIM_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The same validator and strictness as the macOS job: threading and state bugs a DAW hides.
      - name: Install pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      # bash, not PowerShell: pluginval.exe is a GUI-subsystem program, and PowerShell does not
      # wait for those. The first run returned after five seconds, mid-way through the editor
      # tests, with a green tick that meant nothing. bash waits, and takes its exit code.
      - name: Validate the VST3
        shell: bash
        run: |
          ./pluginval/pluginval.exe --strictness-level 10 \
            --validate build/AmpSim_artefacts/Release/VST3/AmpSim.vst3

      # Each page of the panel as Windows renders it, for looking at: nothing here can judge a
      # caption that has moved or a font that has fallen back, but a person can, from the artefact.
      - name: Render the panel
        run: ./build/ampsim_snapshot.exe panel 1.5

      - uses: actions/upload-artifact@v4
        with:
          name: AmpSim-Windows-panel
          path: panel/*.png
          if-no-files-found: error

      # Also proves the build is AVX2: a build that lost the flag would still pass every test,
      # and only cost more. Then the benchmark, which asserts nothing; a shared runner changes
      # hardware between runs, so compare figures only within one job. 48 kHz is the model's own
      # rate; 44.1 kHz puts the resampler in the chain.
      - name: Benchmark
        run: |
          if (-not (Select-String -Path build/build.ninja -Pattern '/arch:AVX2' -SimpleMatch -Quiet)) {
            throw "/arch:AVX2 did not reach the compile lines"
          }
          (Get-CimInstance Win32_Processor).Name
          ./build/ampsim_bench.exe 48000
          ./build/ampsim_bench.exe 44100

      # Not an installer: the raw build, for trying by hand until packaging is decided.
      - uses: actions/upload-artifact@v4
        with:
          name: AmpSim-Windows
          path: |
            build/AmpSim_artefacts/Release/Standalone/AmpSim.exe
            build/AmpSim_artefacts/Release/VST3/AmpSim.vst3
          if-no-files-found: error

  macos:
    name: macOS (Release)
    # macos-latest rather than a pinned version: GitHub retires old runner images, and a pinned
    # label that has been retired fails before it builds anything.
    runs-on: macos-latest
    permissions:
      contents: write   # only used by the release step on tags

    steps:
      - uses: actions/checkout@v4
        with:
          # JUCE, NAM Core, Eigen, nlohmann/json and Catch2 are all submodules, and NAM Core has
          # submodules of its own. Shallow, because no history is needed to build a pinned tag.
          submodules: recursive
          fetch-depth: 1

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # The offline suite: DSP behaviour, state round-trips, MIDI mapping, presets. This is the
      # layer the plugin validators never look at.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # And the validators: threading and state bugs that a DAW hides. This is a Release build, so
      # AMPSIM_COPY_PLUGIN is on by default and COPY_PLUGIN_AFTER_BUILD has
      # already put the AU where auval will find it.
      - name: Validate the Audio Unit
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Amp1 Ctcd

      - name: Install pluginval
        run: |
          curl -fsSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip

      - name: Validate the VST3
        # Drop --strictness-level if the runner ever proves flaky about opening editors; the GUI
        # tests are the part that depends on a window server.
        run: |
          ./pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 10 \
            --validate build/AmpSim_artefacts/Release/VST3/AmpSim.vst3

      # Proves the installer still builds and signs on every run, and is what a tagged run
      # publishes.
      - name: Package
        # Reuses the build above rather than making a second one; the script only has to
        # reconfigure to drop the tests.
        run: AMPSIM_BUILD_DIR=build ./packaging/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AmpSim-macOS
          path: build/artefacts/*
          if-no-files-found: error

      # Tags only. The tag has to match the version in CMakeLists.txt, which is also where
      # package.sh reads it from and so where the artefacts take their names — the same sed
      # expression, deliberately, so the two cannot disagree about what is being released.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^project(AmpSim VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version $version in CMakeLists.txt" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" build/artefacts/* \
            --title "AmpSim $version" \
            --notes "AmpSim $version for Macs with Apple silicon (macOS 11 or later). Ad-hoc signed: the first use needs System Settings > Privacy & Security > Open Anyway; see the installer's welcome page. User guide: https://catastrophiccoder.github.io/ampsim/" \
            --verify-tag
